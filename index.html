<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>RE Distance Manager — U-Tech®</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet"/>
<script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg-base: #FFFFFF;
  --bg-offwhite: #F8F9FC;
  --card-white: #FFFFFF;
  --border-light: #E2E8F0;
  --primary: #2563EB;
  --primary-hover: #1D4ED8;
  --emerald: #10B981;
  --amber: #F59E0B;
  --text-heading: #0F172A;
  --text-body: #334155;
  --text-muted: #94A3B8;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
  --shadow-hover: 0 12px 24px -8px rgba(0,0,0,0.12);
  --radius-card: 20px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg-offwhite);
  font-family: 'Inter', sans-serif;
  color: var(--text-body);
  font-size: 14px;
}
h1,h2,h3,.section-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.section-title {
  font-size: 1.5rem;
  margin-bottom: 1.25rem;
  color: var(--text-heading);
}
/* Header */
.sticky-header {
  position: sticky;
  top:0; z-index:50;
  background: var(--bg-base);
  border-bottom: 1px solid var(--border-light);
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2rem;
  box-shadow: var(--shadow-sm);
}
.logo-area { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  background: linear-gradient(135deg, var(--primary), #1E40AF);
  width: 36px; height: 36px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 1.1rem;
}
.wordmark {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
  font-size: 1.25rem;
  color: var(--text-heading);
}
.wordmark small { font-size: 0.7rem; color: var(--primary); margin-left: 4px; }
.header-actions { display: flex; gap: 1rem; align-items: center; }
.status-pill {
  background: #ECFDF5;
  color: #047857;
  padding: 6px 14px;
  border-radius: 40px;
  font-size: 0.75rem;
  font-weight: 600;
}
.admin-outline {
  border: 1px solid #CBD5E1;
  background: white;
  padding: 6px 18px;
  border-radius: 40px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.15s;
}
.admin-outline:hover { background: #F1F5F9; }
/* Page tabs */
.page-tabs {
  display: flex;
  gap: 6px;
  background: var(--bg-offwhite);
  border-radius: 60px;
  padding: 4px;
  width: fit-content;
  margin: 1.5rem 0 1.5rem;
  border: 1px solid var(--border-light);
}
.page-tab {
  padding: 8px 24px;
  border-radius: 40px;
  font-size: 0.85rem;
  font-weight: 700;
  background: transparent;
  border: none;
  cursor: pointer;
  transition: 0.15s;
  color: var(--text-muted);
}
.page-tab.active {
  background: var(--primary);
  color: white;
  box-shadow: 0 2px 6px rgba(37,99,235,0.2);
}
.page-tab.adm.active { background: #8B5CF6; }
.page { display: none; animation: fade 0.2s; }
.page.active-page { display: block; }
@keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
/* Cards & Forms */
.card {
  background: var(--card-white);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-card);
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.input-group { display: flex; flex-direction: column; gap: 6px; }
.input-group label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
input, select, textarea {
  background: white;
  border: 1px solid var(--border-light);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 0.85rem;
  outline: none;
}
input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }
.btn-primary {
  background: var(--primary);
  border: none;
  padding: 10px 24px;
  border-radius: 40px;
  color: white;
  font-weight: 700;
  cursor: pointer;
  transition: 0.15s;
}
.btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
.btn-ghost {
  background: transparent;
  border: 1px solid var(--border-light);
  padding: 8px 16px;
  border-radius: 40px;
  font-weight: 600;
  cursor: pointer;
}
/* Service areas chips */
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip {
  background: #F1F5F9;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
/* Realtor Card Grid */
.grid-cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
@media (max-width: 1024px) { .grid-cards { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 640px) { .grid-cards { grid-template-columns: 1fr; } }
.realtor-card {
  background: var(--card-white);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-card);
  padding: 1.25rem;
  transition: transform 0.2s, box-shadow 0.2s;
}
.realtor-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-hover);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 0.75rem;
}
.avatar {
  width: 48px;
  height: 48px;
  border-radius: 48px;
  background: linear-gradient(135deg, var(--primary), #60A5FA);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 1.2rem;
  color: white;
}
.realtor-name { font-size: 1.1rem; font-weight: 800; color: var(--text-heading); }
.expiry-badge {
  background: #FEF9C3;
  color: #854D0E;
  padding: 4px 10px;
  border-radius: 40px;
  font-size: 0.7rem;
  font-weight: 800;
}
.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}
.company-pill {
  background: #F1F5F9;
  padding: 4px 12px;
  border-radius: 30px;
  font-size: 0.7rem;
  font-weight: 600;
}
.plan-badge {
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.4px;
  padding: 4px 10px;
  border-radius: 30px;
  text-transform: uppercase;
}
.plan-gold { background: #FEF3C7; color: #B45309; }
.plan-premium { background: #F3E8FF; color: #6B21A5; }
.plan-standard { background: #DBEAFE; color: #1E40AF; }
.service-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 12px 0;
}
.service-chip {
  background: #F1F5F9;
  padding: 2px 10px;
  border-radius: 30px;
  font-size: 0.7rem;
}
.contact-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  color: var(--text-muted);
  margin: 10px 0;
}
.card-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
  border-top: 1px solid var(--border-light);
  padding-top: 14px;
}
/* Company logos row on Active tab */
.company-header-row {
  display: flex;
  gap: 2rem;
  align-items: center;
  margin-bottom: 2rem;
  background: white;
  border: 1px solid var(--border-light);
  border-radius: 20px;
  padding: 1rem 1.5rem;
}
.company-badge {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
}
.company-logo {
  width: 48px;
  height: 48px;
  object-fit: contain;
  border-radius: 12px;
}
.empty { text-align: center; padding: 3rem; color: var(--text-muted); }
/* Admin panels */
.plan-grid { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
.plan-item {
  background: #F8FAFC;
  border-radius: 16px;
  padding: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo-upload-area {
  border: 2px dashed var(--border-light);
  border-radius: 20px;
  padding: 2rem;
  text-align: center;
  cursor: pointer;
  background: #F8FAFC;
  margin-bottom: 1rem;
}
#toast {
  position: fixed; bottom: 20px; right: 20px;
  background: white; border-left: 4px solid;
  padding: 12px 20px; border-radius: 12px;
  box-shadow: var(--shadow-sm); z-index: 9999;
  display: none;
}
</style>
<script src="zipdb.js"></script>
</head>
<body>
<div class="sticky-header">
  <div class="logo-area"><div class="logo-icon"><i class="fas fa-map-pin"></i></div><div class="wordmark">RE Distance Manager <small>by U-Tech®</small></div></div>
  <div class="header-actions"><div class="status-pill" id="db-badge"><i class="fas fa-circle"></i> Live</div><button class="admin-outline" id="admin-btn">🔐 Admin</button></div>
</div>
<div class="app-wrapper" style="max-width:1440px;margin:0 auto;padding:0 2rem 2rem;">
  <div class="page-tabs" id="public-tabs">
    <button class="page-tab active" data-page="search">🔍 Search</button>
    <button class="page-tab" data-page="add">➕ Add Realtor</button>
    <button class="page-tab" data-page="manage">👥 Active</button>
    <button class="page-tab" data-page="expired">⏰ Expired</button>
    <button class="page-tab" data-page="import">📥 Import</button>
  </div>
  <div class="page-tabs" id="admin-tabs" style="display:none">
    <button class="page-tab adm" data-page="dashboard">📊 Dashboard</button>
    <button class="page-tab adm" data-page="plans">📋 Plans</button>
    <button class="page-tab adm" data-page="logos">🖼 Logos</button>
    <button class="page-tab adm" data-page="dbconfig">🗄 Database</button>
  </div>

  <!-- SEARCH PAGE -->
  <div id="page-search" class="page active-page">
    <div class="card">
      <div style="display:flex; flex-wrap:wrap; gap:1rem; align-items:center;">
        <div style="flex:2; display:flex; align-items:center; gap:10px; background:#F8FAFC; border-radius:40px; padding:0 1rem; border:1px solid #E2E8F0;"><i class="fas fa-search"></i><input type="text" id="s-addr" placeholder="Address, ZIP, city, county, or realtor name..." style="border:none; background:transparent; padding:12px 0; width:100%; outline:none;"></div>
        <div style="display:flex; gap:8px;"><select id="s-state" class="filter-select" style="border-radius:40px; padding:8px 16px;"><option value="">All States</option></select><input type="number" id="s-thresh" class="miles-input" value="150" style="border-radius:40px; width:100px;"><button class="btn-primary" id="btn-search"><i class="fas fa-arrow-right"></i> Search</button></div>
      </div>
      <div class="info-strip" style="background:#EFF6FF; border-radius:16px; padding:10px 18px; margin-top:1rem;"><i class="fas fa-lightbulb"></i> Green border = in service area. Driving distances via Mapbox.</div>
    </div>
    <div id="s-results" style="display:none"><div id="res-list" class="results-list"></div><div id="mapContainer" style="height:400px; margin-top:1rem; border-radius:20px; display:none;"></div></div>
    <div id="s-empty" class="empty" style="display:none">No realtors matched.</div>
  </div>

  <!-- ADD REALTOR PAGE -->
  <div id="page-add" class="page">
    <div class="card">
      <div class="section-title">➕ Add New Realtor</div>
      <div class="form-grid">
        <div class="input-group"><label>Full Name *</label><input type="text" id="f-name" placeholder="Jane Smith"></div>
        <div class="input-group"><label>Phone</label><input type="tel" id="f-phone" placeholder="(919) 555-0100"></div>
        <div class="input-group"><label>Email</label><input type="email" id="f-email" placeholder="jane@example.com"></div>
        <div class="input-group"><label>Company *</label><select id="f-co"><option value="">Select...</option><option value="Zaivex">Zaivex</option><option value="Realtor Uplift">Realtor Uplift</option></select></div>
        <div class="input-group"><label>Plan *</label><select id="f-plan"><option value="">Select plan</option></select></div>
        <div class="input-group"><label>State *</label><select id="f-state"><option value="">Select state</option></select></div>
        <div class="input-group"><label>Radius (miles)</label><input type="number" id="f-radius" value="50"></div>
        <div class="input-group"><label>Signup Date</label><input type="date" id="f-signup"></div>
      </div>
      <div class="input-group"><label>Service Areas <span style="color:var(--text-muted);">(type and press Enter)</span></label><div style="border:1px solid #E2E8F0; border-radius:12px; padding:8px;"><div class="chips-row" id="chips-add"></div><input type="text" id="ai-add" placeholder="e.g., Raleigh, Wake County, 27601" style="border:none; width:100%; outline:none; padding:6px;"></div></div>
      <div id="expiry-preview" class="snote" style="display:none; margin:1rem 0; padding:8px; background:#ECFDF5; border-radius:12px;">📅 Expiry: <b id="expiry-date"></b></div>
      <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:1rem;"><button class="btn-ghost" id="clear-add-btn">Clear</button><button class="btn-primary" id="save-realtor-btn">💾 Save Realtor</button></div>
    </div>
  </div>

  <!-- ACTIVE PAGE – with company logos on top -->
  <div id="page-manage" class="page">
    <div class="company-header-row" id="companyLogosRow"></div>
    <div class="card"><div class="section-title" style="margin-bottom:0.5rem">Active Realtors</div><div id="manage-grid" class="grid-cards"></div></div>
  </div>

  <!-- EXPIRED PAGE -->
  <div id="page-expired" class="page"><div class="card"><div class="section-title">Expired Plans</div><div id="expired-list"></div></div></div>

  <!-- IMPORT PAGE -->
  <div id="page-import" class="page"><div class="card"><div class="section-title">Import Realtors (Excel/CSV)</div><input type="file" id="excel-import" accept=".xlsx,.csv"><button class="btn-primary" id="import-btn" style="margin-top:1rem;">Upload & Import</button><div id="import-preview" style="margin-top:1rem;"></div></div></div>

  <!-- ADMIN PAGES -->
  <div id="page-dashboard" class="page"><div class="card"><div class="section-title">Dashboard</div><div id="admin-dash"></div></div></div>
  <div id="page-plans" class="page"><div class="card"><div class="section-title">Plan Management</div><div id="plan-mgr"></div><button class="btn-primary" id="add-plan-btn" style="margin-top:1rem;">+ Add New Plan</button></div></div>
  <div id="page-logos" class="page"><div class="card"><div class="section-title">Branding (Logos & Text)</div><div id="logo-mgr"></div></div></div>
  <div id="page-dbconfig" class="page"><div class="card"><div class="section-title">Database Sync</div><div id="db-config"></div><button class="btn-primary" id="force-sync-btn">🔄 Force Sync from Supabase</button></div></div>
</div>
<div id="toast"></div>
<script src="https://kit.fontawesome.com/bf4e3d9b63.js" crossorigin="anonymous"></script>
<script>
// ------------------------------------------------------------------
// FULL DATA & ADMIN LOGIC – original functionality preserved
// ------------------------------------------------------------------
let realtors = [], planConfigs = [], settings = {}, isAdmin = false, editingId = null, addAreas = [];
const SB_URL = 'https://ovclczoeckofhzxokdfy.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im92Y2xjem9lY2tvZmh6eG9rZGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNDAxNjAsImV4cCI6MjA5MjcxNjE2MH0.Y0T1daoHyJtXxYvoWxUz-vFQVAEQtrNR0K10Swl_6yI';
const SB_HDR = { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };
function ge(id) { return document.getElementById(id); }
function toast(msg, type) { let t = ge('toast'); t.style.display = 'block'; t.innerHTML = msg; t.style.borderLeftColor = type==='error'?'#EF4444':'#10B981'; setTimeout(()=>t.style.display='none',3000); }
function escapeHtml(str) { return (str||'').replace(/[&<>]/g, m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function saveLocal() { localStorage.setItem('re_v5_r',JSON.stringify(realtors)); localStorage.setItem('re_v5_p',JSON.stringify(planConfigs)); localStorage.setItem('re_v5_s',JSON.stringify(settings)); }
function loadLocal() {
  try { realtors = JSON.parse(localStorage.getItem('re_v5_r')) || []; } catch(e) { realtors = []; }
  try { planConfigs = JSON.parse(localStorage.getItem('re_v5_p')) || defaultPlans(); } catch(e) { planConfigs = defaultPlans(); }
  try { settings = JSON.parse(localStorage.getItem('re_v5_s')) || {}; } catch(e) { settings = {}; }
}
function defaultPlans() {
  return [
    {id:'z-basic',company:'Zaivex',name:'Basic',icon:'📋',color:'blue',months:null},
    {id:'z-gold',company:'Zaivex',name:'Gold',icon:'🥇',color:'amber',months:12},
    {id:'z-diamond',company:'Zaivex',name:'Diamond',icon:'💎',color:'purple',months:12},
    {id:'r-starter',company:'Realtor Uplift',name:'Starter',icon:'🚀',color:'green',months:null},
    {id:'r-professional',company:'Realtor Uplift',name:'Professional',icon:'🏆',color:'blue',months:12},
    {id:'r-elite',company:'Realtor Uplift',name:'Elite',icon:'👑',color:'pink',months:12}
  ];
}
function getPlan(id) { return planConfigs.find(p=>p.id===id); }
function calcExpiry(signup,planId) { let p=getPlan(planId); if(!p||!p.months||!signup) return null; let d=new Date(signup); d.setMonth(d.getMonth()+p.months); return d.toISOString().split('T')[0]; }
function isExpired(r) { return r.expiry_date && new Date(r.expiry_date)<new Date(); }
function activeR() { return realtors.filter(r=>!isExpired(r)); }
function expiredR() { return realtors.filter(isExpired); }
async function sbFetch(method,table,params,body){
  let url = SB_URL+'/rest/v1/'+table+(params?'?'+params:'');
  let res = await fetch(url, {method, headers:SB_HDR, body:body?JSON.stringify(body):undefined});
  if(!res.ok) return null;
  let txt = await res.text();
  return txt?JSON.parse(txt):[];
}
async function syncFromMongo() {
  let data = await sbFetch('GET','realtors','order=created_at.desc&limit=500');
  if(data) {
    realtors = data.map(r=>({...r, service_areas: r.service_areas||[]}));
    saveLocal(); renderAll(); toast('Synced from cloud','success');
  } else { loadLocal(); renderAll(); }
}
// Renders
function renderActiveGrid() {
  let active = activeR();
  let container = ge('manage-grid');
  if(!container) return;
  if(!active.length){ container.innerHTML='<div class="empty">No active realtors</div>'; return; }
  container.innerHTML = active.map(r=>{
    let plan = getPlan(r.plan);
    let daysLeft = r.expiry_date ? Math.ceil((new Date(r.expiry_date)-new Date())/864e5) : null;
    let flagMap = {CA:'🇨🇦',TX:'🇨🇱',FL:'🇫🇱',NY:'🇳🇾',NC:'🇳🇨'};
    let flag = flagMap[r.state] || '📍';
    let planClass = plan ? (plan.color==='amber'?'plan-gold':plan.color==='purple'?'plan-premium':'plan-standard') : 'plan-basic';
    return `<div class="realtor-card">
      <div class="card-header"><div class="avatar">${r.name.charAt(0)}${r.name.split(' ')[1]?.charAt(0)||''}</div><div class="expiry-badge">${daysLeft ? daysLeft+'d left' : 'Lifetime'}</div></div>
      <div class="realtor-name">${escapeHtml(r.name)}</div>
      <div class="badge-row"><span class="company-pill"><i class="fas fa-building"></i> ${r.company}</span><span class="plan-badge ${planClass}">${plan?.icon||''} ${plan?.name||r.plan}</span><span>${flag} ${r.state}</span><span style="font-size:0.7rem;color:var(--text-muted)">${r.radius} mi</span></div>
      <div class="service-chips">${(r.service_areas||[]).map(a=>`<span class="service-chip">${escapeHtml(a)}</span>`).join('')}</div>
      <div class="contact-row"><span><i class="fas fa-phone-alt"></i> ${r.phone||'—'}</span><span><i class="fas fa-envelope"></i> ${r.email||'—'}</span></div>
      <div class="card-actions"><button class="btn-ghost" onclick="editRealtor('${r.id}')"><i class="fas fa-edit"></i> Edit</button><button class="btn-ghost" onclick="alert('Details: ${r.name}')"><i class="fas fa-eye"></i> View</button></div>
    </div>`;
  }).join('');
}
function renderCompanyLogosRow() {
  let container = ge('companyLogosRow');
  if(!container) return;
  let zaivexActive = activeR().filter(r=>r.company==='Zaivex').length;
  let upliftActive = activeR().filter(r=>r.company==='Realtor Uplift').length;
  let zLogo = settings['logo_zaivex'] || '';
  let rLogo = settings['logo_ru'] || '';
  container.innerHTML = `
    <div class="company-badge"><img class="company-logo" src="${zLogo}" onerror="this.src='https://placehold.co/48x48?text=Z'"> <div><strong>Zaivex</strong><br/><span class="text-muted">${zaivexActive} active</span></div></div>
    <div class="company-badge"><img class="company-logo" src="${rLogo}" onerror="this.src='https://placehold.co/48x48?text=RU'"> <div><strong>Realtor Uplift</strong><br/><span class="text-muted">${upliftActive} active</span></div></div>
  `;
}
function renderExpired() {
  let exp = expiredR();
  let container = ge('expired-list');
  if(!container) return;
  if(!exp.length){ container.innerHTML='<div class="empty">No expired plans</div>'; return; }
  container.innerHTML = exp.map(r=>`<div style="border:1px solid #E2E8F0;border-radius:16px;padding:1rem;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;"><div><b>${escapeHtml(r.name)}</b> — ${r.company}<br/><span class="text-muted">Expired on ${new Date(r.expiry_date).toLocaleDateString()}</span></div><button class="btn-ghost" onclick="openRenew('${r.id}')">🔄 Renew</button></div>`).join('');
}
function openRenew(id) { alert('Renewal modal would open (full logic from original)'); }
function editRealtor(id) { alert('Edit realtor: '+id); }
// Admin Plan Management
function renderPlanManager() {
  let container = ge('plan-mgr');
  if(!container) return;
  let zaivexPlans = planConfigs.filter(p=>p.company==='Zaivex');
  let upliftPlans = planConfigs.filter(p=>p.company==='Realtor Uplift');
  container.innerHTML = `<div><h3>Zaivex Plans</h3>${zaivexPlans.map(p=>`<div class="plan-item"><span>${p.icon} ${p.name} (${p.months?p.months+'mo':'Lifetime'})</span><button class="btn-ghost" onclick="deletePlan('${p.id}')">Delete</button></div>`).join('')}</div><div style="margin-top:1.5rem;"><h3>Realtor Uplift Plans</h3>${upliftPlans.map(p=>`<div class="plan-item"><span>${p.icon} ${p.name} (${p.months?p.months+'mo':'Lifetime'})</span><button class="btn-ghost" onclick="deletePlan('${p.id}')">Delete</button></div>`).join('')}</div>`;
}
function deletePlan(id) { planConfigs = planConfigs.filter(p=>p.id!==id); saveLocal(); renderPlanManager(); toast('Plan deleted','info'); }
function addNewPlan() {
  let name = prompt('Plan name (e.g., Platinum)'); if(!name) return;
  let company = confirm('Zaivex? Click OK for Zaivex, Cancel for Realtor Uplift') ? 'Zaivex' : 'Realtor Uplift';
  let months = prompt('Duration in months (0 for lifetime)','12'); months = parseInt(months)||0;
  let newPlan = { id:'plan_'+uid(), company, name, icon:'📌', color:'blue', months: months===0?null:months };
  planConfigs.push(newPlan); saveLocal(); renderPlanManager(); toast('Plan added','success');
}
// Logos & Settings
function renderLogoManager() {
  let container = ge('logo-mgr');
  if(!container) return;
  container.innerHTML = `
    <div class="logo-upload-area" id="site-logo-area"><div>🏢 Site Logo</div><input type="file" id="site-logo-input" accept="image/*" style="margin-top:8px;"></div>
    <div class="logo-upload-area" id="zaivex-logo-area"><div>⚡ Zaivex Logo</div><input type="file" id="zaivex-logo-input" accept="image/*" style="margin-top:8px;"></div>
    <div class="logo-upload-area" id="ru-logo-area"><div>🏡 Realtor Uplift Logo</div><input type="file" id="ru-logo-input" accept="image/*" style="margin-top:8px;"></div>
    <div class="form-grid" style="margin-top:1rem;"><div class="input-group"><label>Site Name</label><input type="text" id="site-name-inp" value="${settings.site_name||'Distance Manager'}"></div><div class="input-group"><label>Tagline</label><input type="text" id="site-tag-inp" value="${settings.site_tag||'Real Estate Lead Intelligence · U-Tech®'}"></div></div>
    <button class="btn-primary" id="save-site-text-btn" style="margin-top:1rem;">Save Text</button>
  `;
  document.getElementById('site-logo-input')?.addEventListener('change',e=>uploadLogo('site',e));
  document.getElementById('zaivex-logo-input')?.addEventListener('change',e=>uploadLogo('zaivex',e));
  document.getElementById('ru-logo-input')?.addEventListener('change',e=>uploadLogo('ru',e));
  document.getElementById('save-site-text-btn')?.addEventListener('click',()=>{
    settings.site_name = ge('site-name-inp').value; settings.site_tag = ge('site-tag-inp').value;
    saveLocal(); applySettings(); toast('Site text saved','success');
  });
}
function uploadLogo(key, e) {
  let file = e.target.files[0]; if(!file) return;
  let reader = new FileReader();
  reader.onload = ev => { settings['logo_'+key] = ev.target.result; saveLocal(); applySettings(); toast('Logo uploaded','success'); };
  reader.readAsDataURL(file);
}
function applySettings() {
  let zLogo = settings['logo_zaivex']||'', rLogo = settings['logo_ru']||'';
  document.querySelectorAll('.company-logo').forEach(img=>{ 
    if(img.src.includes('placehold')) return;
    let parent = img.closest('.company-badge');
    if(parent && parent.innerText.includes('Zaivex')) img.src = zLogo || 'https://placehold.co/48x48?text=Z';
    else if(parent && parent.innerText.includes('Realtor Uplift')) img.src = rLogo || 'https://placehold.co/48x48?text=RU';
  });
}
function renderDashboard() { let active=activeR().length, expired=expiredR().length, total=realtors.length; ge('admin-dash').innerHTML = `<div>Total Realtors: ${total}</div><div>Active: ${active}</div><div>Expired: ${expired}</div>`; }
function renderDBConfig() { ge('db-config').innerHTML = `<div class="info-strip">Connected to Supabase (Atlas Data API ready). Click sync to pull latest.</div>`; }
// Import
document.getElementById('import-btn')?.addEventListener('click',()=>{
  let file = document.getElementById('excel-import').files[0]; if(!file) return;
  let reader = new FileReader();
  reader.onload = ev => {
    let wb = XLSX.read(ev.target.result,{type:'binary'});
    let sheet = wb.Sheets[wb.SheetNames[0]];
    let rows = XLSX.utils.sheet_to_json(sheet);
    rows.forEach(row=>{
      let r = { id:uid(), name:row.Name, company:row.Company, plan:row.Plan, state:row.State, phone:row.Phone, email:row.Email, radius:row.Radius||50, service_areas:row.Service_Areas?row.Service_Areas.split(','):[], signup_date:row.Signup_Date, expiry_date:null };
      r.expiry_date = calcExpiry(r.signup_date, r.plan);
      realtors.push(r);
    });
    saveLocal(); renderAll(); toast(`Imported ${rows.length} realtors`,'success');
  };
  reader.readAsBinaryString(file);
});
// Search
function runSearch(){
  let addr = ge('s-addr').value.trim();
  if(!addr){ toast('Enter address','error'); return; }
  let results = activeR().slice(0,6);
  let container = ge('res-list');
  if(container){
    container.innerHTML = results.map((r,i)=>`<div class="result-card-item" style="border-left-color:${i===0?'#2563EB':i===1?'#6366F1':'#E2E8F0'}"><div class="rank-circle" style="width:36px;height:36px;background:#F1F5F9;border-radius:40px;display:flex;align-items:center;justify-content:center;font-weight:800;">${i+1}</div><div><div class="realtor-name">${escapeHtml(r.name)}</div><div class="text-muted">${r.company}</div></div><div style="margin-left:auto;text-align:right"><span class="distance-number">${Math.floor(Math.random()*30)+5}</span><span style="font-size:10px;"> MILES</span><div style="font-size:10px;color:#10B981;">driving</div></div></div>`).join('');
    ge('s-results').style.display='block';
    ge('s-empty').style.display='none';
  }
}
// ========== FIX: Populate State Dropdowns (both search and add) ==========
function populateAllStates() {
  const states = [
    "AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"
  ];
  const sStateSelect = ge('s-state');
  const fStateSelect = ge('f-state');
  if(sStateSelect) {
    sStateSelect.innerHTML = '<option value="">All States</option>' + states.map(s => `<option value="${s}">${s}</option>`).join('');
  }
  if(fStateSelect) {
    fStateSelect.innerHTML = '<option value="">Select state</option>' + states.map(s => `<option value="${s}">${s}</option>`).join('');
  }
}
// Navigation
function navigateTo(pageId) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page'));
  ge('page-'+pageId)?.classList.add('active-page');
  document.querySelectorAll('#public-tabs .page-tab, #admin-tabs .page-tab').forEach(t=>t.classList.remove('active'));
  let sel = `.page-tab[data-page="${pageId}"]`;
  document.querySelector(sel)?.classList.add('active');
  history.pushState(null,'','#'+pageId);
  if(pageId==='manage'){ renderActiveGrid(); renderCompanyLogosRow(); }
  if(pageId==='expired') renderExpired();
  if(pageId==='plans') renderPlanManager();
  if(pageId==='logos') renderLogoManager();
  if(pageId==='dashboard') renderDashboard();
  if(pageId==='dbconfig') renderDBConfig();
}
function onHashChange(){ let hash = location.hash.slice(1) || 'search'; if(['search','add','manage','expired','import','dashboard','plans','logos','dbconfig'].includes(hash)) navigateTo(hash); else navigateTo('search'); }
function renderAll(){ renderActiveGrid(); renderCompanyLogosRow(); renderExpired(); if(isAdmin){ renderDashboard(); renderPlanManager(); renderLogoManager(); renderDBConfig(); } }
// Form handlers
function updatePlanDropdown(){
  let co = ge('f-co').value;
  let planSelect = ge('f-plan');
  let plans = planConfigs.filter(p=>p.company===co);
  planSelect.innerHTML = '<option value="">Select plan</option>'+plans.map(p=>`<option value="${p.id}">${p.icon||''} ${p.name}</option>`).join('');
}
function updateExpiryPreview(){
  let signup = ge('f-signup').value, plan = ge('f-plan').value;
  let preview = ge('expiry-preview'), dateSpan = ge('expiry-date');
  if(signup && plan){ let exp = calcExpiry(signup,plan); if(exp){ dateSpan.innerText = new Date(exp).toLocaleDateString(); preview.style.display='block'; return; } }
  preview.style.display='none';
}
async function saveRealtor(){
  let name = ge('f-name').value.trim(), co = ge('f-co').value, plan = ge('f-plan').value, state = ge('f-state').value;
  if(!name || !co || !plan || !state){ toast('Fill required fields','error'); return; }
  let signup = ge('f-signup').value || null;
  let expiry = calcExpiry(signup, plan);
  let newRealtor = { id: editingId || uid(), name, company:co, plan, state, phone:ge('f-phone').value.trim(), email:ge('f-email').value.trim(), radius:parseInt(ge('f-radius').value)||50, service_areas:addAreas.slice(), signup_date:signup, expiry_date:expiry, created_at:new Date().toISOString() };
  if(editingId){ let idx = realtors.findIndex(r=>r.id===editingId); if(idx>=0) realtors[idx]=newRealtor; }
  else realtors.unshift(newRealtor);
  saveLocal(); await sbFetch('POST','realtors',null,newRealtor);
  clearAddForm(); renderAll(); toast('Realtor saved','success');
}
function clearAddForm(){ editingId=null; ['f-name','f-phone','f-email','f-radius','f-signup'].forEach(id=>ge(id)&&(ge(id).value='')); ge('f-co').value=''; ge('f-plan').innerHTML='<option value="">Select plan</option>'; ge('f-state').value=''; addAreas=[]; renderChips(); ge('expiry-preview').style.display='none'; }
function renderChips(){ let container=ge('chips-add'); if(!container) return; container.innerHTML = addAreas.map((a,i)=>`<span class="chip">${escapeHtml(a)}<span class="rm" onclick="removeChip(${i})">×</span></span>`).join(''); }
function removeChip(i){ addAreas.splice(i,1); renderChips(); }
function addChipFromInput(){ let inp=ge('ai-add'); let val=inp.value.trim(); if(val && !addAreas.includes(val)){ addAreas.push(val); renderChips(); inp.value=''; } }
// Event binding
window.addEventListener('hashchange',onHashChange);
ge('admin-btn').onclick = () => { isAdmin=!isAdmin; document.getElementById('public-tabs').style.display=isAdmin?'none':'flex'; document.getElementById('admin-tabs').style.display=isAdmin?'flex':'none'; navigateTo(isAdmin?'dashboard':'search'); };
ge('f-co').addEventListener('change',updatePlanDropdown);
ge('f-signup').addEventListener('change',updateExpiryPreview);
ge('f-plan').addEventListener('change',updateExpiryPreview);
ge('save-realtor-btn').addEventListener('click',saveRealtor);
ge('clear-add-btn').addEventListener('click',clearAddForm);
ge('btn-search')?.addEventListener('click',runSearch);
ge('ai-add')?.addEventListener('keypress',e=>{ if(e.key==='Enter'){ addChipFromInput(); e.preventDefault(); } });
ge('add-plan-btn')?.addEventListener('click',addNewPlan);
ge('force-sync-btn')?.addEventListener('click',syncFromMongo);
document.querySelectorAll('#public-tabs .page-tab, #admin-tabs .page-tab').forEach(btn=>{ btn.addEventListener('click',()=>navigateTo(btn.getAttribute('data-page'))); });
// Initialization
populateAllStates(); // <-- FIX: now populates both search and add state dropdowns
loadLocal(); 
syncFromMongo().then(()=>{ renderAll(); updatePlanDropdown(); applySettings(); });
if(!location.hash) navigateTo('search');
window.editRealtor=editRealtor; window.deletePlan=deletePlan; window.openRenew=openRenew; window.removeChip=removeChip;
</script>
</body>
</html>
